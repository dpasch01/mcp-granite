        battery_id: "BT002"
        status: "discharging"
        discharge_rate_kw: 50.0
    - tool: energy_control
      arguments:
        action: "set_load"
        zone_id: "LZ005"
        priority: 5
    - tool: energy_control
      arguments:
        action: "create_schedule"
        name: "Peak Load Shedding"
        target_id: "LZ003"
        operation: "shed_load"
        scheduled_time: "2025-06-01T14:00:00"
