id: industrial-002
domain: industrial
name: Handle conveyor belt fault
description: >
  The conveyor belt MC003 is showing a fault status with high vibration.
  User wants to diagnose the issue, acknowledge any alerts, and create
  an urgent work order for maintenance.
difficulty: medium
user_prompt: >
  The conveyor belt MC003 is showing a fault. Diagnose the issue by
  checking its status and telemetry, acknowledge any active alerts for it,
  and create a high-priority work order to investigate and repair it.

gold_standard:
  primitive:
    - tool: get_machine_status
      arguments: { machine_id: "MC003" }
    - tool: read_telemetry
      arguments: { machine_id: "MC003" }
    - tool: get_active_alerts
      arguments: { machine_id: "MC003" }
    - tool: acknowledge_alert
      arguments: { alert_id: "AL001" }
    - tool: create_work_order
      arguments:
        machine_id: "MC003"
        priority: "high"
        description: "Investigate conveyor belt fault - high vibration and temperature"

  composite_4:
    - tool: handle_fault
      arguments:
        machine_id: "MC003"
        create_order: true
        priority: "high"

  composite_2:
    - tool: industrial_action
      arguments:
        action: "handle_fault"
        machine_id: "MC003"
        create_order: true
        priority: "high"

  composite_1:
    - tool: industrial
      arguments:
        action: "handle_fault"
        machine_id: "MC003"
        create_order: true
        priority: "high"

expected_output:
  contains:
    - "MC003"
    - "conveyor"
    - "work order"
  values: {}
