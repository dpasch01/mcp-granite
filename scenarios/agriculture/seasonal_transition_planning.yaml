id: agriculture-009
domain: agriculture
name: Seasonal transition planning
description: >
  User wants to plan the transition from current growing season. Must audit
  all crops and their growth stages, check which are harvest-ready, review
  irrigation needs, schedule drone surveys for crop assessment, check weather
  forecasts, and update crop statuses.
difficulty: hard
user_prompt: >
  We need to plan for the seasonal transition. Review all crops and their
  growth stages, identify which fields need irrigation adjustments for
  the upcoming harvest period, schedule drone surveys over each field
  for a final crop assessment, check weather forecasts, and update
  any crops that are ready for harvest.

gold_standard:
