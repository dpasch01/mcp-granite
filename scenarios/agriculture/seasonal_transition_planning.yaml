    - tool: list_crops
      arguments: {}
    - tool: get_crop
      arguments: { crop_id: "CR001" }
    - tool: get_crop
      arguments: { crop_id: "CR002" }
    - tool: get_crop
      arguments: { crop_id: "CR003" }
    - tool: get_crop
      arguments: { crop_id: "CR004" }
    - tool: get_crop
      arguments: { crop_id: "CR005" }
    - tool: get_crop
      arguments: { crop_id: "CR006" }
    - tool: list_irrigation_zones
      arguments: {}
    - tool: get_weather
      arguments: {}
    - tool: schedule_drone_task
